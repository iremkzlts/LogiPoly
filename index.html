<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LogiPoly - Lojistik Bilgi Oyunu</title>
  <meta name="description" content="LogiPoly: Sınıfça oynanan, Monopoly tarzı lojistik bilgi oyunu.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23062b3d'/><text x='50' y='68' font-family='Arial' font-weight='700' font-size='52' text-anchor='middle' fill='%23ff7a1a'>LP</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="game-page">
  <header class="topbar">
    <div class="brand">Logi<span>Poly</span></div>
    <nav>
      <button class="btn ghost sm" id="btnFull"></button>
      <button class="btn ghost sm" id="btnSound"></button>
      <button class="btn ghost sm" id="btnHelp" data-icon="info">Nasıl Oynanır</button>
      <button class="btn ghost sm" id="btnNewGame" data-icon="rotate">Yeni Oyun</button>
      <a class="btn ghost sm" href="admin.html" data-icon="sliders">Yönetici Paneli</a>
    </nav>
  </header>

  <main class="screen">
    <div class="layout">
      <div class="board-wrap">
        <div id="board" class="board">
          <div class="board-center">
            <div class="center-logo">
              <span class="cl-rule"></span>
              <span class="cl-text">Logi<b>Poly</b></span>
              <span class="cl-rule"></span>
            </div>
            <div class="center-play">
              <div class="person-box" id="personBox">
                <span class="person-label" id="personLabel">Seçilen kişi</span>
                <span class="person-name" id="personName">—</span>
              </div>
              <button class="btn primary roll-btn" id="btnMain">Kişi Seç</button>
            </div>
          </div>
          <div id="pawnLayer" class="pawn-layer"></div>
        </div>
      </div>

      <aside class="sidebar">
        <div class="panel">
          <h3>Yolculuk</h3>
          <div class="progress-text" id="progressText"></div>
          <div class="progress"><div id="progressBar"></div></div>
          <div class="class-stats">
            <div><b id="statCorrect">0</b><span>Doğru</span></div>
            <div><b id="statWrong">0</b><span>Yanlış</span></div>
            <div><b id="statPeople">0</b><span>Katılan</span></div>
          </div>
        </div>
        <div class="panel">
          <h3>Gümrükte Bekleyenler</h3>
          <ul id="detainedList" class="detained-list"></ul>
        </div>
        <div class="panel">
          <h3>Oyun Akışı</h3>
          <ul id="gameLog" class="game-log"></ul>
        </div>
        <div class="panel">
          <h3>Kategoriler</h3>
          <div id="legend" class="legend"></div>
        </div>
      </aside>
    </div>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/sound.js"></script>
  <script src="assets/js/confetti.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/game.js"></script>
</body>
</html>
